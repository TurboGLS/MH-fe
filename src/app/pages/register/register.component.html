<div class="registerBox">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <h3 class="text-center mb-4">Registration</h3>

        <!-- USERNAME -->
        <input formControlName="username" placeholder="Username" />
        <div *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.invalid" class="error">
            Username obbligatorio
        </div>

        <!-- EMAIL -->
        <input formControlName="email" placeholder="Email" type="email" />
        <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="error">
            <span *ngIf="registerForm.get('email')?.errors?.['required']">Email obbligatoria</span>
            <span *ngIf="registerForm.get('email')?.errors?.['email']">Formato email non valido</span>
        </div>

        <!-- PASSWORD -->
        <input formControlName="password" placeholder="Password" type="password" />
        <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="error">
            <span *ngIf="registerForm.get('password')?.errors?.['required']">Password obbligatoria</span>
            <span *ngIf="registerForm.get('password')?.errors?.['minlength']">La password deve contenere almeno 8
                caratteri</span>
        </div>


        <!-- SERVER ERROR -->
        <div *ngIf="registerError" class="error">{{ registerError }}</div>

        <!-- BOTTONE -->
        <button type="submit" [disabled]="registerForm.invalid">Registrati</button>
    </form>
</div>
