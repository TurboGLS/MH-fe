<div class="pageBlock">
  <div class="btnHome">
    <button class="homeBtn" (click)="backToHome()" aria-label="Torna alla home">
      <fa-icon [icon]="faHouse"></fa-icon>
    </button>
  </div>

  <div class="container">
    <div class="loginBox">
      <form (ngSubmit)="login()" [formGroup]="loginForm" novalidate>
        <h3>Login</h3>

        <div class="formGroup">
          <label for="username">Username</label>
          <input id="username" type="email" formControlName="username" placeholder="Enter your username" />
          <div class="text-danger"
            *ngIf="loginForm.get('username')?.invalid && (loginForm.get('username')?.dirty || loginForm.get('username')?.touched)">
            Please enter a valid username.
          </div>
        </div>

        <div class="formGroup passwordGroup">
          <label for="password">Password</label>
          <div class="passwordInputWrapper">
            <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
              placeholder="Enter your password" />
            <button type="button" class="togglePasswordBtn" (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Nascondi password' : 'Mostra password'">
              <fa-icon [icon]="showPassword ? faEyeSlash : faEye"></fa-icon>
            </button>
          </div>
        </div>

        <div class="text-danger generalError" *ngIf="loginError">
          {{ loginError }}
        </div>

        <div class="btnContainer">
          <button type="submit" [disabled]="loginForm.invalid || isLoading">
            <ng-container *ngIf="!isLoading; else loadingTpl">
              Sign in
            </ng-container>
            <ng-template #loadingTpl>
              <span class="spinner"></span> Loading...
            </ng-template>
          </button>
          <small>
            Don't have an account?
            <a [routerLink]="['/register']">Register here</a>
          </small>
        </div>
      </form>
    </div>
  </div>
</div>
