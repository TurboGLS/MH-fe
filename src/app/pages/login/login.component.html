<div class="container vh-100 d-flex align-items-center justify-content-center">
  <div class="col-12 col-md-8 col-lg-4 p-4 border rounded shadow-sm">
    <form (ngSubmit)="login()" [formGroup]="loginForm" novalidate>
      <h3 class="text-center mb-4">Login</h3>

      <!-- Username -->
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" type="email" class="form-control" formControlName="username"
          placeholder="Enter your username" />
        <div class="text-danger mt-1"
          *ngIf="loginForm.get('username')?.invalid && (loginForm.get('username')?.dirty || loginForm.get('username')?.touched)">
          Please enter a valid username.
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" class="form-control" formControlName="password"
          placeholder="Enter your password" />
        <div class="text-danger mt-1"
          *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)">
          Password is required.
        </div>
      </div>


      <!-- General error -->
      <div class="text-danger text-center mb-3" *ngIf="loginError">
        {{ loginError }}
      </div>

      <!-- Submit button -->
      <div class="d-grid">
        <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">
          Sign in
        </button>

        <!-- Register Link -->
         <small>
          Don't have an account?
          <a [routerLink]="['/register']">Register here</a>
         </small>
      </div>
    </form>
  </div>
</div>
