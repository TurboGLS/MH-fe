<form [formGroup]="varlistForm" (ngSubmit)="onSubmit()" class="form">
  <!-- Categoria -->
  <div class="form-group">
    <label for="deviceModel">Categoria Dispositivo</label>
    <select id="deviceModel" formControlName="deviceModel">
      <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
    </select>
  </div>

  <!-- Modello -->
  <div class="form-group">
    <label for="model">Modello</label>
    <select id="model" formControlName="model">
      <option value="" disabled selected *ngIf="models.length === 0">Seleziona una categoria prima</option>
      <option *ngFor="let model of models" [value]="model.Modello">{{ model.Modello }}</option>
    </select>
  </div>

  <!-- Aux -->
  <div class="form-group">
    <label for="auxNumber">Aux</label>
    <input 
      id="auxNumber" 
      type="text" 
      formControlName="auxNumber" 
      placeholder="Inserisci Aux" 
    />
    <div *ngIf="isInvalid('auxNumber')" class="error">
      <small>{{ getErrorMessage('auxNumber') }}</small>
    </div>
  </div>

  <!-- Descrizione -->
  <div class="form-group">
    <label for="description">Descrizione</label>
    <input 
      id="description" 
      type="text" 
      formControlName="description" 
      placeholder="Inserisci Descrizione" 
    />
    <div *ngIf="isInvalid('description')" class="error">
      <small>{{ getErrorMessage('description') }}</small>
    </div>
  </div>

  <!-- Device Address -->
  <div class="form-group">
    <label for="deviceAddress">Device Address</label>
    <input
      id="device"
      type="text"
      formControlName="device"
      placeholder="Inserisci il numero del Device"
    />
    <div *ngIf="isInvalid('device')" class="error">
      <small>{{ getErrorMessage('device') }}</small>
    </div>
  </div>

  <!-- Indirizzo IP -->
  <div class="form-group">
    <label for="ipAddress">Ip Address</label>
    <input
      id="ipAddress"
      type="text"
      formControlName="ipAddress"
      placeholder="Inserisci l'indirizzo IP"
    />
    <div *ngIf="isInvalid('ipAddress')" class="error">
      <small>{{ getErrorMessage('ipAddress') }}</small>
    </div>
  </div>

  <!-- Generator Button -->
  <div class="form-group">
    <form [formGroup]="varlistForm" (ngSubmit)="onSubmit()">
      <button type="submit">Genera VarList</button>
    </form>
  </div>
</form>
